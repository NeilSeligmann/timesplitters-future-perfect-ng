[project]
name = "tsfp-decomp-tools"
version = "0.1.0"
description = "Analysis toolchain for the TimeSplitters: Future Perfect decompilation"
requires-python = ">=3.11"
dependencies = [
    "capstone>=5.0.9",
    "unicorn==2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",  # T3722 per-test limit; was only hand-installed on the owner PC, so remote hosts had no limit
    "coverage>=7.10.0",
    "ruff>=0.9.0",
    "python-xlib>=0.33",  # T3821 windowed capture close step (tools/t982_acceptance.py), was hand-installed only
]
# tools.port_heatmap rendering only; synced into its own environment (tmp/venvs/heatmap) so the main
# venv's `uv sync` never prunes it (the hand-installed copies vanished 2026-10-28, publishing failed).
heatmap = [
    "matplotlib>=3.9",
    "squarify>=0.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pin imports to this checkout: the venv editable install can point at another tree.
pythonpath = ["."]
# loadgroup: tests sharing an xdist_group marker run on one worker (order-dependent coverage sets).
addopts = "-ra --strict-markers --dist=loadgroup"
# T3722: pytest-timeout was loaded (T3674 guards that) but had no limit, so one hung test held a
# remote verify for its whole 1800 s command timeout. Per test: 300 s (slowest measured 47 s);
# a test that needs more says so with @pytest.mark.timeout(N).
timeout = 300
markers = [
    "integration: requires a real disc image; skipped by default",
    "slow: focused test that waits on an operating-system resource for over one second",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# third_party/ is vendored upstream code under its own licence. Linting or
# reformatting it would make every local adaptation an unreadable diff against
# upstream and would gate our build on someone else's style. See the tools/lift
# package docstring for the integration model.
# T729 temporary format exclusions: files that open task branches edit, formatting would conflict. Remove once those merge (see docs/tasks.md T729).
extend-exclude = ["third_party", "tools/mutate/sets/dsound.py", "tools/tracegaps/addresstaking.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
# E501: `ruff format` wraps code; long docstring/comment lines were failing commits and landings
# (I-T3885: 34 of 266 dry runs) for cosmetic reasons only.
ignore = ["ANN401", "E501"]

[tool.ruff.lint.isort]
# 2026-10-31: sparse lane worktrees lack some packages, so auto-detection classified `docs` as
# third-party there and `ruff --fix` reordered imports differently than the full landing tree.
known-first-party = ["docs", "tools", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN202"]
