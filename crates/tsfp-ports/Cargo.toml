[package]
name = "tsfp-ports"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib", "staticlib"]

# Host workspace consumers use std; direct-rustc lifted harnesses keep no_std.
[features]
default = ["std"]
std = ["dep:tsfp-engine-memory"]
# The shared render_prep.rs source's fixtures are owned by tsfp-engine-render.
render-prep-tests = []
# T1690 tests may call the cold lifted Map Maker reference bodies. The host does not enable this.
editor-next-reference = ["dep:tsfp-port-mapmaker-editor-native", "dep:tsfp-port-mapmaker-editor-native-2"]
# T2384: expose the retained lifted editor body to Tier 1 tests only.
editor-reference = []
# T3434: oracle builds keep the A/B switch of Rule 24 retired systems (tools.retire).
lifted-oracle = []
test-diagnostics = []

[dependencies]
tsfp-render-prep-wire = { path = "../tsfp-render-prep-wire" }
tsfp-ai-spawn-binding = { path = "../tsfp-ai-spawn-binding" }
tsfp-ai-selector-transition = { path = "../tsfp-ai-selector-transition" }
tsfp-engine-memory = { path = "../tsfp-engine-memory", optional = true }
tsfp-port-engine-physics-ray = { path = "../tsfp-port-engine-physics-ray" }
tsfp-port-runtime = { path = "../tsfp-port-runtime" }
tsfp-port-audio-dispatch = { path = "../tsfp-port-audio-dispatch" }
tsfp-port-gameplay-modes-multiplayer-1 = { path = "../tsfp-port-gameplay-modes-multiplayer-1" }
tsfp-engine-object = { path = "../tsfp-engine-object" }
tsfp-port-native-candidate-support = { path = "../tsfp-port-native-candidate-support" }
tsfp-port-engine-anim-adapter = { path = "../tsfp-port-engine-anim-adapter" }
tsfp-port-wire = { path = "../tsfp-port-wire" }
# T3765: generated c2r lane roots (tools/lanes.py), appended to runtime::ROOTS.
tsfp-lane-c2r = { path = "../tsfp-lane-c2r" }
tsfp-weapon-owner = { path = "../tsfp-weapon-owner" }
tsfp-weapon-realization = { path = "../tsfp-weapon-realization" }
tsfp-port-mapmaker-storage = { path = "../tsfp-port-mapmaker-storage" }
tsfp-port-mapmaker-ui = { path = "../tsfp-port-mapmaker-ui" }
tsfp-port-mapmaker-ui-native = { path = "../tsfp-port-mapmaker-ui-native" }
tsfp-port-mapmaker-ui-native-2 = { path = "../tsfp-port-mapmaker-ui-native-2" }
tsfp-port-gameplay-inventory = { path = "../tsfp-port-gameplay-inventory" }
tsfp-port-gameplay-modes = { path = "../tsfp-port-gameplay-modes" }
tsfp-port-gameplay-player = { path = "../tsfp-port-gameplay-player" }
tsfp-port-ui-menu = { path = "../tsfp-port-ui-menu" }
tsfp-port-ui-settings = { path = "../tsfp-port-ui-settings" }
tsfp-port-ai-characters = { path = "../tsfp-port-ai-characters" }
tsfp-port-ai-pathfinding = { path = "../tsfp-port-ai-pathfinding" }
tsfp-port-ai-behavior = { path = "../tsfp-port-ai-behavior" }
tsfp-port-data-cutscenes = { path = "../tsfp-port-data-cutscenes" }
tsfp-port-data-missions = { path = "../tsfp-port-data-missions" }
tsfp-port-data-save = { path = "../tsfp-port-data-save" }
tsfp-port-data-text = { path = "../tsfp-port-data-text" }
tsfp-port-engine-object = { path = "../tsfp-port-engine-object" }
tsfp-port-engine-physics = { path = "../tsfp-port-engine-physics" }
tsfp-port-engine-render-effects = { path = "../tsfp-port-engine-render-effects" }
tsfp-port-engine-render-scene = { path = "../tsfp-port-engine-render-scene" }
tsfp-port-ui-framework = { path = "../tsfp-port-ui-framework" }
tsfp-port-engine-render-d3d = { path = "../tsfp-port-engine-render-d3d" }
