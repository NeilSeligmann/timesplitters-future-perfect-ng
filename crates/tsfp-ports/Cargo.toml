tsfp-port-ui-hud-6 = { path = "../tsfp-port-ui-hud-6" }
tsfp-port-data-missions-4 = { path = "../tsfp-port-data-missions-4" }
tsfp-port-data-missions-5 = { path = "../tsfp-port-data-missions-5" }
tsfp-port-data-missions-6 = { path = "../tsfp-port-data-missions-6" }
tsfp-port-gameplay-weapons-3 = { path = "../tsfp-port-gameplay-weapons-3" }
tsfp-port-gameplay-weapons-4 = { path = "../tsfp-port-gameplay-weapons-4" }

[dev-dependencies]
tsfp-port-runtime = { path = "../tsfp-port-runtime", features = ["thread-retire"] }
tsfp-port-wire = { path = "../tsfp-port-wire", features = ["thread-retire"] }
tsfp-engine-anim = { path = "../tsfp-engine-anim" }
tsfp-engine-fileio = { path = "../tsfp-engine-fileio" }
tsfp-format-profile = { path = "../tsfp-format-profile" }
tsfp-network = { path = "../tsfp-network" }

# Keep standalone host integration tests out of both the root workspace and any
# enclosing checkout workspace (for example, while running inside a worktree).
[workspace]

# The no_std lib has its own panic handler; T2399 made it a dependency-bearing
# package, so plain cargo check needs panic=abort (tests still unwind).
[profile.dev]
panic = "abort"
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

[profile.release]
panic = "abort"

[profile.dev.package."*"]
debug = false

# T2454: cfgs set only by tools (coverage harness, lane mutation); declared so rustc does not warn at every use.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tsfp_cover)", "cfg(rust_lane_mutation)", "cfg(tsfp_mmx_harness)", "cfg(s3_missions_owned_differential)"] }
