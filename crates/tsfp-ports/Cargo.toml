tsfp-port-mapmaker-editor-native-2 = { path = "../tsfp-port-mapmaker-editor-native-2", optional = true }
tsfp-port-mapmaker-modes = { path = "../tsfp-port-mapmaker-modes" }
tsfp-port-network-live = { path = "../tsfp-port-network-live" }
tsfp-port-network-session = { path = "../tsfp-port-network-session" }
tsfp-port-ui-hud = { path = "../tsfp-port-ui-hud" }
tsfp-port-engine-object-2 = { path = "../tsfp-port-engine-object-2" }
tsfp-port-engine-object-3 = { path = "../tsfp-port-engine-object-3" }
tsfp-port-engine-object-4 = { path = "../tsfp-port-engine-object-4" }
tsfp-port-engine-object-5 = { path = "../tsfp-port-engine-object-5" }
tsfp-port-engine-object-6 = { path = "../tsfp-port-engine-object-6" }
tsfp-port-engine-object-tier2 = { path = "../tsfp-port-engine-object-tier2" }
tsfp-port-engine-render-effects-2 = { path = "../tsfp-port-engine-render-effects-2" }
tsfp-port-engine-render-effects-live-return = { path = "../tsfp-port-engine-render-effects-live-return" }
tsfp-port-library-xdk-2 = { path = "../tsfp-port-library-xdk-2" }
tsfp-port-misc = { path = "../tsfp-port-misc" }
tsfp-port-network-live-2 = { path = "../tsfp-port-network-live-2" }
tsfp-port-network-syslink = { path = "../tsfp-port-network-syslink" }
tsfp-port-ai-behavior-2 = { path = "../tsfp-port-ai-behavior-2" }
tsfp-port-data-missions-2 = { path = "../tsfp-port-data-missions-2" }
tsfp-port-data-missions-3 = { path = "../tsfp-port-data-missions-3" }
tsfp-port-engine-input = { path = "../tsfp-port-engine-input" }
tsfp-port-engine-math = { path = "../tsfp-port-engine-math" }
tsfp-port-gameplay-player-2 = { path = "../tsfp-port-gameplay-player-2" }
tsfp-player-interaction-fast-path = { path = "../tsfp-player-interaction-fast-path" }
tsfp-port-gameplay-weapons = { path = "../tsfp-port-gameplay-weapons" }
tsfp-port-ui-framework-2 = { path = "../tsfp-port-ui-framework-2" }
tsfp-port-ui-menu-2 = { path = "../tsfp-port-ui-menu-2" }
tsfp-port-ui-menu-3 = { path = "../tsfp-port-ui-menu-3" }
tsfp-port-engine-render-effects-3 = { path = "../tsfp-port-engine-render-effects-3" }
lighting_t2 = { package = "tsfp-port-lighting-t2-div-lighting-1", path = "../tsfp-port-lighting-t2-div-lighting-1" }
tsfp-port-gameplay-weapons-2 = { path = "../tsfp-port-gameplay-weapons-2" }
tsfp-port-ui-hud-2 = { path = "../tsfp-port-ui-hud-2" }
tsfp-port-ui-hud-3 = { path = "../tsfp-port-ui-hud-3" }
