[package]
name = "tsfp-input-sdl-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust-owned SDL controller provider state"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
sdl3 = ["dep:sdl3"]

[dependencies]
sdl3 = { version = "=0.20.0", optional = true, default-features = false }

# SDL FFI is confined to the feature-gated adapter module.
[lints.rust]
unsafe_code = "deny"
