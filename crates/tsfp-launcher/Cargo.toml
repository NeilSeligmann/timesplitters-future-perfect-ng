[package]
name = "tsfp-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Desktop launcher: setup wizard, settings, content packs, mods, verify (T4332)"
publish = false

# Own workspace root, excluded from the main workspace like crates/tsfp-bevy: iced is a few hundred crates and must
# not enter `cargo check --workspace`. All launcher logic lives in tsfp-launcher-core; this crate is the iced view.
[workspace]

[dependencies]
tsfp-launcher-core = { path = "../tsfp-launcher-core" }
tsfp-settings = { path = "../tsfp-settings" }
serde_json = "=1.0.145"
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "thread-pool", "x11", "wayland", "web-colors"] }
rfd = "0.17.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
