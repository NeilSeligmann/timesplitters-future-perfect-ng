[package]
name = "tsfp-bevy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"
publish = false

# T2023 Bevy shell. Own workspace root and NOT a member of the main workspace (the root Cargo.toml excludes it), like
# crates/_spikes/bevy-spike: Bevy is 300+ crates and must not enter `cargo check --workspace`. Build with its own
# CARGO_TARGET_DIR (docs/t-bevy-shell.md). build.rs links the C host (tsfp_host_bevylink) when TSFP_BEVY_HOST_BUILD_DIR is set,
# otherwise the binary is a stub, as for crates/tsfp-game.
[workspace]

[dependencies]
tsfp-format-profile = { path = "../tsfp-format-profile" }
tsfp-audio = { path = "../tsfp-audio" }
tsfp-data-formats = { path = "../tsfp-data-formats" }
tsfp-engine-memory = { path = "../tsfp-engine-memory" }
tsfp-memory-abi = { path = "../tsfp-memory-abi", features = ["direct-witness"] }
tsfp-engine-fileio = { path = "../tsfp-engine-fileio" }
tsfp-engine-core = { path = "../tsfp-engine-core" }
tsfp-engine-physics = { path = "../tsfp-engine-physics" }
tsfp-host = { path = "../tsfp-host" }
tsfp-gameplay = { path = "../tsfp-gameplay" }
tsfp-state = { path = "../tsfp-state" }
# T3742: `--t2-offline`, the capture-based Tier 2 offline runner (host API in src/host/rust_ports.c).
tsfp-t2-offline = { path = "../tsfp-t2-offline" }
# T3796: `--t2-construct`, constructed-call Tier 2 reference capture (dispatches `--t2-offline` too).
tsfp-t2-construct = { path = "../tsfp-t2-construct" }
bevy = { version = "=0.16.1", default-features = false, features = [
  "bevy_asset", "bevy_core_pipeline", "bevy_render", "bevy_sprite", "bevy_winit",
  "bevy_window", "bevy_log", "bevy_audio", "bevy_gilrs", "x11", "wayland", "multi_threaded",
  "std", "async_executor",
] }

# The binary compiles every module in `src/main.rs`; these crates are linked
# by the live shell as well as referenced by its focused unit tests.
tsfp-types = { path = "../tsfp-types" }
tsfp-engine-render = { path = "../tsfp-engine-render" }
tsfp-scene-capture = { path = "../tsfp-scene-capture" }
tsfp-bevy-nohost-link = { path = "../tsfp-bevy-nohost-link" }
tsfp-render-prep = { path = "../tsfp-render-prep" }
tsfp-render-preview = { path = "../tsfp-render-preview" }
tsfp-input = { path = "../tsfp-input" }
# T3820: the single device intake (input.rec v6 `D` rows) and the SDL device codes.
tsfp-input-intake = { path = "../tsfp-input-intake" }
tsfp-input-slots = { path = "../tsfp-input-slots" }
# Intro movies under --wgpu-share: the mailbox picture wins while the C compositor holds an overlay.
tsfp-movie-overlay = { path = "../tsfp-movie-overlay" }
tsfp-network = { path = "../tsfp-network" }
# T2229: the shell creates the wgpu device it shares with Bevy and the render runtime (same 24.0.5 as bevy_render 0.16.1 and tsfp-wgpu).
wgpu = { version = "=24.0.5", default-features = false }
# T2246: the render runtime is linked INTO the shell as an rlib (one copy of wgpu and of parking_lot_core). The T2229 design shared wgpu
# objects between the shell and libtsfp_rt_host.so, two copies of wgpu-core with two parking_lot_core hash tables: a lock contended across
# the copies loses its wakeup and the render thread (or the shell) hangs forever. build.rs drops the .so from the link line.
tsfp-rt-host = { path = "../tsfp-rt-host" }
# T2189 slice 15: the Rust UI overlay (--ui=rust); same wgpu 24.0.5.
tsfp-ui-ext = { path = "../tsfp-ui-ext" }
tsfp-ui-renderer = { path = "../tsfp-ui-renderer" }
tsfp-ui-model = { path = "../tsfp-ui-model" }
tsfp-ui-wgpu = { path = "../tsfp-ui-wgpu" }
# T2188: interactive --ui=rust main menu (UiInput, LiveMenu, LegacyMenuBindings).
tsfp-ui-input = { path = "../tsfp-ui-input" }
tsfp-text-field = { path = "../tsfp-text-field" }
tsfp-wgpu = { path = "../tsfp-wgpu" }
tsfp-engine-video = { path = "../tsfp-engine-video" }
tsfp-mapmaker = { path = "../tsfp-mapmaker" }

[dev-dependencies]
# The Cargo test harness has no C host; enable the shared offline T2 ABI stubs for its bin target.
tsfp-t2-offline = { path = "../tsfp-t2-offline", features = ["test-link-stubs"] }

# T2319: let Bevy use the Wayland seat for the GPU laptop live UI route; winit prefers WAYLAND_DISPLAY, with X11 retained as fallback.
# T2479: route every rustix syscall through libc. DMTCP (whole-process route snapshots) only
# interposes libc; rustix's raw-syscall backend creates calloop/polling eventfds and epolls that
# DMTCP cannot see, so a restored host failed with EBADF. Functionally identical otherwise.
[target.'cfg(target_os = "linux")'.dependencies]
rustix-libc-038 = { package = "rustix", version = "0.38", default-features = false, features = ["use-libc"] }
rustix-libc = { package = "rustix", version = "1", default-features = false, features = ["use-libc"] }

[profile.release]
debug = 0
incremental = true
codegen-units = 256

# T2396: local path crates use the same optimized incremental profile as the
# root workspace, so the host and opt-in tools can share compatible artifacts.
[profile.release.package."*"]
opt-level = 3
debug = 0
incremental = false
codegen-units = 16

[profile.release.package.tsfp-audio]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-engine-anim]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-engine-fileio]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-engine-render]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-engine-video]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-format-anim]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-format-bs]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-format-core]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-format-pak]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-format-profile]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-format-xbr]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-format-xbt]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-host]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-import]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-input]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-kernel-services]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-network]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-ports]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-rt-host]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-state]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-text-field]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-types]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-ui-ext]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-ui-input]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-ui-model]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-ui-renderer]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-ui-wgpu]
incremental = true
codegen-units = 256
[profile.release.package.tsfp-wgpu]
incremental = true
codegen-units = 256

[profile.dev]
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
