[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

# T1836: the c-diff harness runs 120,000 cases per root, so its test crate is optimised.
[profile.dev.package.tsfp-c-diff]
opt-level = 2
[profile.dev.package.tsfp-engine-physics]
opt-level = 2

# T2396: favor fast release rebuilds for this repo's Rust crates. Registry deps
# retain optimized, non-incremental release settings; local crates use the same
# profile whether they are workspace members or path dependencies.
[profile.release]
debug = 0
incremental = true
codegen-units = 256

[profile.release.package."*"]
opt-level = 3
debug = 0
incremental = false
codegen-units = 16

