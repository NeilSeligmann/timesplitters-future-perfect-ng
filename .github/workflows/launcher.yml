# Launcher build matrix for the public repo (github.com/NeilSeligmann/timesplitters-future-perfect-ng).
# Source of truth: tools/release/github/workflows/ in the private repo; the release export (T4337) copies it to
# .github/workflows/. Decision: docs/decisions/launcher.md.
name: launcher

# Builds for release tags (owner 2026-11-02: no CI minutes on ordinary main pushes or PRs). Manual runs stay
# available from the Actions tab.
# Build cache: GitHub lets a run restore caches from its own ref or the default branch only, so a cache saved by one
# tag is invisible to the next. The cache is saved on main: automatically when the toolchain changes, and by a manual
# run on main after a dependency upgrade. Every release bumps Cargo.lock, so the lockfile is not a trigger (it would
# start a full main build next to every release). Tag runs restore the newest cache; with changed dependencies the
# restore falls back to the closest older cache and only the changed crates compile.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Intel Macs (macos-x64) are built manually from source, not in releases (owner 2026-11-02).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { name: windows-x64, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches launcher version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/tsfp-launcher/Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != launcher version v$version"; exit 1; }
      - name: Toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tsfp-launcher -> target
          shared-key: launcher-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Test core
        run: cargo test -p tsfp-launcher-core --locked
      - name: Test launcher
        run: cargo test --manifest-path crates/tsfp-launcher/Cargo.toml --locked
      - name: Build
        run: cargo build --release --locked --manifest-path crates/tsfp-launcher/Cargo.toml --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          out=dist/tsfp-launcher-${{ matrix.name }}
          mkdir -p "$out"
          cp crates/tsfp-launcher/target/${{ matrix.target }}/release/tsfp-launcher${{ runner.os == 'Windows' && '.exe' || '' }} "$out/"
          cp LICENSE "$out/"
          # Release asset name the updater looks for (tsfp_launcher_core::update::platform_asset).
          mkdir -p release
          cp crates/tsfp-launcher/target/${{ matrix.target }}/release/tsfp-launcher${{ runner.os == 'Windows' && '.exe' || '' }} \
            release/tsfp-launcher-${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Installer formats
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        shell: bash
        run: |
          bin=crates/tsfp-launcher/target/${{ matrix.target }}/release/tsfp-launcher
          case "${{ matrix.name }}" in
            linux-x64) sh tools/release/package/appimage.sh "$bin" x86_64 release/tsfp-launcher-linux-x64.AppImage ;;
            linux-arm64) sh tools/release/package/appimage.sh "$bin" aarch64 release/tsfp-launcher-linux-arm64.AppImage ;;
            macos-arm64) sh tools/release/package/macos_dmg.sh "$bin" "${GITHUB_REF_NAME#v}" release/tsfp-launcher-macos-arm64.dmg ;;
          esac
      - uses: actions/upload-artifact@v7
        # Cache-refresh runs on main produce nothing anyone downloads.
        if: github.ref != 'refs/heads/main'
        with:
          name: tsfp-launcher-${{ matrix.name }}
          path: dist/
      # Each platform signs and attaches its own assets as soon as it is built (owner 2026-11-02), so early
      # platforms are downloadable while slower runners are still queued. Tags with a `-` suffix are pre-releases
      # (Nightly channel). The updater installs only assets whose .minisig verifies against the embedded key.
      - name: Sign and attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sh tools/release/package/sign.sh release/*
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          # The first platform to finish creates the release; the others find it.
          for attempt in 1 2 3 4 5; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $pre >/dev/null 2>&1 && break
            sleep $((attempt * 3))
          done
          gh release upload "$GITHUB_REF_NAME" release/* --clobber

  # SHA256SUMS over every asset once all platforms are in (each asset also has its own .sha256 immediately).
  # Check: sha256sum --ignore-missing -c SHA256SUMS
  checksums:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Assemble, sign and attach SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sums
          gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir sums
          cat sums/*.sha256 | sed 's/ \*/  /' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          sh tools/release/package/sign.sh SHA256SUMS
          files=SHA256SUMS; [ -f SHA256SUMS.minisig ] && files="$files SHA256SUMS.minisig"
          gh release upload "$GITHUB_REF_NAME" $files --clobber
