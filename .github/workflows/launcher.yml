# Launcher build matrix for the public repo (github.com/NeilSeligmann/timesplitters-future-perfect-ng).
# Source of truth: tools/release/github/workflows/ in the private repo; the release export (T4337) copies it to
# .github/workflows/. Decision: docs/decisions/launcher.md.
name: launcher

# Builds only for release tags (owner 2026-11-02: no CI minutes on main pushes or PRs). Manual runs stay
# available from the Actions tab for one-off checks.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Intel Macs (macos-x64) are built manually from source, not in releases (owner 2026-11-02).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { name: windows-x64, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches launcher version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/tsfp-launcher/Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != launcher version v$version"; exit 1; }
      - name: Toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Test core
        run: cargo test -p tsfp-launcher-core --locked
      - name: Test launcher
        run: cargo test --manifest-path crates/tsfp-launcher/Cargo.toml --locked
      - name: Build
        run: cargo build --release --locked --manifest-path crates/tsfp-launcher/Cargo.toml --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          out=dist/tsfp-launcher-${{ matrix.name }}
          mkdir -p "$out"
          cp crates/tsfp-launcher/target/${{ matrix.target }}/release/tsfp-launcher${{ runner.os == 'Windows' && '.exe' || '' }} "$out/"
          cp LICENSE "$out/"
          # Release asset name the updater looks for (tsfp_launcher_core::update::platform_asset).
          mkdir -p release
          cp crates/tsfp-launcher/target/${{ matrix.target }}/release/tsfp-launcher${{ runner.os == 'Windows' && '.exe' || '' }} \
            release/tsfp-launcher-${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: tsfp-launcher-${{ matrix.name }}
          path: dist/
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.name }}
          path: release/

  # Tags v* publish a signed GitHub Release; tags with a `-` suffix are pre-releases (Nightly channel).
  # The updater installs only assets whose .minisig verifies against the key embedded in the launcher.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # Without the secret the release still ships binaries; the updater ignores unsigned releases.
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set: publishing unsigned binaries (auto-update skips them)"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in release/*; do
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -t "tsfp-launcher ${GITHUB_REF_NAME}"
          done
          rm -f "$RUNNER_TEMP/minisign.key"
          ls -l release
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
